{{FONTS}}
{{CSS}}
<div id="app" class="app">
  <aside class="rail" aria-label="Navegación principal">
    <a class="brand" href="#inicio" data-nav="inicio">{{BRANDMARK}}</a>
    <nav class="rail-nav" id="railNav"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <div class="stage">
    <header class="topbar" id="topbar">
      <button class="iconbtn back" id="backBtn" type="button" aria-label="Volver" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="topbar-title" id="topTitle"></div>
      <button class="iconbtn" id="shareTop" type="button" aria-label="Compartir esta pantalla">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 12v6.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>
{{SEO}}
{{ROUTE}}
{{DATA}}
